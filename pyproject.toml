[project]
name = "predictive-speaking"
version = "0.2.0"
description = "常時発話予測システム — 話している最中に続きを予測し、詰まったら本人の声で補助する"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sounddevice>=0.4.7",
    "azure-cognitiveservices-speech>=1.40",
    "python-dotenv>=1.0",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "numpy>=2.5.1",
    "piper-tts>=1.7.0",
    "kokoro-onnx>=0.6.1",
    "vosk>=0.3.45",
    # Windows(Radeon/Intel iGPU含む)はDirectML版onnxruntime。他OSは通常版(下のoverride参照)
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
eval = [
    "torch>=2.4",
    "transformers>=4.44",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
# piper-tts / kokoro-onnx は onnxruntime を要求するが、Windowsでは同じ名前空間を提供する
# onnxruntime-directml と衝突するため、素の onnxruntime は Windows以外でのみ入れる
override-dependencies = ["onnxruntime ; sys_platform != 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_speaking"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
